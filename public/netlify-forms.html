<!doctype html>
<html lang="en">
  <body>
    <!-- Static copy so Netlify Forms can detect the consultation form at deploy time. -->
    <form name="consultation" hidden method="POST" data-netlify="true" netlify-honeypot="website">
      <input type="hidden" name="form-name" value="consultation" />
      <input name="website" />
      <input name="name" />
      <input name="first_name" />
      <input name="last_name" />
      <input name="email" />
      <input name="phone" />
      <input name="zip" />
      <input name="propertyAddress" />
      <input name="service" />
      <input name="budget" />
      <input name="timing" />
      <input name="preferredContact" />
      <textarea name="message"></textarea>
      <input name="smsConsent" />
      <input name="attribution_token" />
      <input name="landingPage" />
      <input name="conversionPage" />
      <input name="referrer" />
      <input name="campaign" />
      <input name="source" />
      <input name="medium" />
      <input name="term" />
      <input name="content" />
      <input name="gclid" />
      <input name="gbraid" />
      <input name="wbraid" />
      <input name="fbclid" />
      <input name="deviceCategory" />
      <input name="serviceContext" />
      <input name="metroContext" />
      <input name="landingVariant" />
    </form>
  </body>
</html>
